<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archive — Kho lưu trữ file</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 8v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8"/>
            <path d="M3 8l2-4h14l2 4"/>
            <path d="M3 8h18"/>
            <path d="M10 12h4"/>
          </svg>
        </span>
        <span class="brand-name" id="brand-name">Archive</span>
      </div>
      <div class="topbar-right">
        <div class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7"/>
            <path d="m20 20-3.5-3.5"/>
          </svg>
          <input type="text" id="search" placeholder="Tìm kiếm file…" autocomplete="off" spellcheck="false">
        </div>
      </div>
    </header>

    <div class="nav-row">
      <nav class="breadcrumb" id="breadcrumb"></nav>
      <div class="version" id="version">
        <button class="version-btn" id="version-btn" aria-haspopup="listbox" aria-expanded="false">
          <span class="v-label" id="version-label"></span>
          <svg class="v-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <ul class="version-menu" id="version-menu" role="listbox" hidden></ul>
      </div>
    </div>

    <section class="panel">
      <div class="toolbar">
        <div class="stats" id="stats"></div>
      </div>
      <div class="table-wrap">
        <table class="filelist">
          <thead>
            <tr>
              <th data-sort="name" class="sortable">Tên <span class="dir"></span></th>
              <th data-sort="size" class="sortable">Kích thước <span class="dir"></span></th>
              <th data-sort="date" class="sortable">Ngày <span class="dir"></span></th>
              <th class="act"></th>
            </tr>
          </thead>
          <tbody id="filelist"></tbody>
        </table>
      </div>
      <div class="empty" id="empty" hidden>Không tìm thấy mục nào.</div>
    </section>

    <footer class="footer" id="footer"></footer>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
