<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý — Archive</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .admin { max-width: 880px; margin: 0 auto; padding: 28px 20px 40px; }
    .admin-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 22px;
    }
    .admin-brand { display: flex; align-items: center; gap: 12px; font-size: 18px; font-weight: 700; }
    .admin-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .admin-who { color: var(--muted); font-size: 13.5px; }
    .admin-section { padding: 20px; margin-bottom: 18px; }
    .admin-section h2 { margin: 0 0 16px; font-size: 15px; font-weight: 700; }
    .sec-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 16px; }
    .sec-head h2 { margin: 0; }
    .upload-form, .pass-form { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .upload-form .input { flex: 1; min-width: 140px; }
    .input {
      padding: 10px 12px;
      border-radius: 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 13.5px;
      font-family: var(--sans);
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .input:focus { border-color: rgba(232, 185, 63, 0.5); box-shadow: 0 0 0 3px var(--gold-soft); }
    input[type="file"].input { padding: 8px; color: var(--muted); }
    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: 10px;
      background: var(--gold);
      color: #0b0e14;
      font-size: 13.5px;
      font-weight: 700;
      font-family: var(--sans);
      cursor: pointer;
      transition: filter 0.12s ease, transform 0.12s ease;
    }
    .btn:hover { filter: brightness(1.06); transform: translateY(-1px); }
    .btn:disabled { opacity: 0.6; cursor: default; transform: none; filter: none; }
    .btn-ghost {
      padding: 9px 14px;
      border-radius: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 13.5px;
      font-family: var(--sans);
      cursor: pointer;
      text-decoration: none;
      transition: border-color 0.12s ease, color 0.12s ease;
    }
    .btn-ghost:hover { border-color: rgba(232, 185, 63, 0.45); color: var(--gold); }
    .version-block {
      border: 1px solid var(--border);
      border-radius: 11px;
      margin-bottom: 14px;
      overflow: hidden;
    }
    .version-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 11px 14px;
      background: var(--surface-2);
      border-bottom: 1px solid var(--border);
    }
    .version-label { font-family: var(--mono); font-weight: 700; color: var(--gold); }
    .tree-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 14px;
      border-bottom: 1px solid var(--border);
      transition: background 0.1s ease;
    }
    .tree-row:last-child { border-bottom: none; }
    .tree-row:hover { background: var(--surface-2); }
    .tree-name { display: flex; align-items: center; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tree-name::before {
      content: "";
      flex: none;
      width: 7px;
      height: 7px;
      border-radius: 2px;
      margin-right: 9px;
      background: var(--faint);
    }
    .tree-name.folder { font-weight: 600; color: var(--gold); }
    .tree-name.folder::before { border-radius: 50%; background: var(--gold); }
    .nested { margin-left: 20px; border-left: 1px solid var(--border); }
    .row-actions { display: flex; gap: 6px; flex: none; }
    .mini-btn {
      padding: 5px 10px;
      border-radius: 7px;
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
      font-family: var(--sans);
      cursor: pointer;
      transition: border-color 0.12s ease, color 0.12s ease;
    }
    .mini-btn:hover { border-color: rgba(232, 185, 63, 0.45); color: var(--gold); }
    .mini-btn.danger:hover { border-color: rgba(255, 138, 138, 0.5); color: var(--red); }
    .tree-empty { padding: 18px; text-align: center; color: var(--faint); font-size: 13.5px; }
    .msg { min-height: 18px; margin-top: 10px; font-size: 13px; color: var(--red); }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);
      padding: 11px 18px;
      border-radius: 10px;
      font-size: 13.5px;
      font-family: var(--sans);
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      box-shadow: 0 16px 40px -18px rgba(0, 0, 0, 0.8);
      z-index: 50;
    }
    .toast.ok { border-color: rgba(95, 216, 138, 0.4); }
    .toast.err { border-color: rgba(255, 138, 138, 0.45); color: var(--red); }
  </style>
</head>
<body>
  <div class="admin">
    <header class="admin-top">
      <div class="admin-brand">
        <span class="brand-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 8v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8"/>
            <path d="M3 8l2-4h14l2 4"/>
            <path d="M3 8h18"/>
            <path d="M10 12h4"/>
          </svg>
        </span>
        <span>Quản lý kho lưu trữ</span>
      </div>
      <div class="admin-actions">
        <span class="admin-who" id="admin-who"></span>
        <a class="btn-ghost" href="index.html">Xem trang</a>
        <button class="btn-ghost" id="btn-logout" type="button">Đăng xuất</button>
      </div>
    </header>

    <section class="panel admin-section">
      <h2>Tải file lên</h2>
      <form id="upload-form" class="upload-form">
        <select id="up-version" class="input"></select>
        <input type="text" id="up-path" class="input" placeholder="Thư mục (bỏ trống = gốc), VD: Phần mềm">
        <input type="file" id="up-file" class="input" required>
        <button type="submit" class="btn">Tải lên</button>
      </form>
      <div class="msg" id="upload-msg"></div>
    </section>

    <section class="panel admin-section">
      <div class="sec-head">
        <h2>Danh sách file</h2>
        <button class="btn" id="btn-add-version" type="button">+ Thêm phiên bản</button>
      </div>
      <div id="tree"></div>
    </section>

    <section class="panel admin-section">
      <h2>Đổi mật khẩu</h2>
      <form id="pass-form" class="pass-form">
        <input type="password" id="pass-current" class="input" placeholder="Mật khẩu hiện tại" autocomplete="current-password">
        <input type="password" id="pass-new" class="input" placeholder="Mật khẩu mới (≥ 6 ký tự)" autocomplete="new-password">
        <button type="submit" class="btn">Đổi mật khẩu</button>
      </form>
      <div class="msg" id="pass-msg"></div>
    </section>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="auth.js"></script>
  <script>
    let archive = null;
    const el = (id) => document.getElementById(id);

    function toast(msg, ok = true) {
      const t = el("toast");
      t.textContent = msg;
      t.className = "toast " + (ok ? "ok" : "err");
      t.hidden = false;
      clearTimeout(toast._t);
      toast._t = setTimeout(() => { t.hidden = true; }, 2600);
    }

    async function loadArchive() {
      const res = await fetch("api/archive");
      if (!res.ok) throw new Error("HTTP " + res.status);
      archive = await res.json();
    }

    function saveArchive() {
      return Auth.api("/api/archive", { method: "POST", body: JSON.stringify(archive) });
    }

    function actionBtn(label, onClick, danger) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "mini-btn" + (danger ? " danger" : "");
      b.textContent = label;
      b.addEventListener("click", onClick);
      return b;
    }

    function promptText(msg, initial) {
      const v = window.prompt(msg, initial || "");
      if (v === null) return null;
      return v.trim() || null;
    }

    function refresh() {
      renderVersions();
      renderTree();
    }

    function renderVersions() {
      const sel = el("up-version");
      sel.innerHTML = "";
      archive.versions.forEach((v) => {
        const o = document.createElement("option");
        o.value = v.label;
        o.textContent = v.label;
        sel.appendChild(o);
      });
    }

    function renderEntries(entries) {
      const wrap = document.createElement("div");
      wrap.className = "tree-entries";
      entries.forEach((e, i) => {
        const row = document.createElement("div");
        row.className = "tree-row";
        const name = document.createElement("span");
        name.className = "tree-name" + (e.type === "folder" ? " folder" : "");
        name.textContent = e.name;
        const acts = document.createElement("span");
        acts.className = "row-actions";
        if (e.type === "folder") {
          acts.appendChild(actionBtn("Thêm thư mục", () => addFolder(e)));
        }
        acts.appendChild(actionBtn("Đổi tên", () => renameEntry(entries, i)));
        acts.appendChild(actionBtn("Xóa", () => deleteEntry(entries, i), true));
        row.appendChild(name);
        row.appendChild(acts);
        wrap.appendChild(row);
        if (e.type === "folder" && e.children) {
          const childWrap = renderEntries(e.children);
          childWrap.classList.add("nested");
          wrap.appendChild(childWrap);
        }
      });
      if (!entries.length) {
        const empty = document.createElement("div");
        empty.className = "tree-empty";
        empty.textContent = "(trống)";
        wrap.appendChild(empty);
      }
      return wrap;
    }

    function renderTree() {
      const tree = el("tree");
      tree.innerHTML = "";
      if (!archive.versions.length) {
        const empty = document.createElement("div");
        empty.className = "tree-empty";
        empty.textContent = "Chưa có phiên bản nào.";
        tree.appendChild(empty);
        return;
      }
      archive.versions.forEach((v, vi) => {
        const block = document.createElement("div");
        block.className = "version-block";

        const head = document.createElement("div");
        head.className = "version-head";
        const title = document.createElement("span");
        title.className = "version-label";
        title.textContent = v.label;
        const acts = document.createElement("span");
        acts.className = "row-actions";
        acts.appendChild(actionBtn("Thêm thư mục", () => addFolder(v)));
        acts.appendChild(actionBtn("Đổi tên", () => renameVersion(vi)));
        acts.appendChild(actionBtn("Xóa", () => deleteVersion(vi), true));
        head.appendChild(title);
        head.appendChild(acts);
        block.appendChild(head);

        block.appendChild(renderEntries(v.entries));
        tree.appendChild(block);
      });
    }

    async function persist() {
      const { status, data } = await saveArchive();
      if (status === 200) {
        archive = data.archive;
        refresh();
        toast("Đã lưu thay đổi.");
      } else {
        toast((data && data.error) || "Lỗi lưu.", false);
      }
    }

    async function addVersion() {
      const label = promptText("Nhập tên phiên bản (VD: 1.21.4)");
      if (!label) return;
      if (archive.versions.some((v) => v.label === label)) { toast("Phiên bản đã tồn tại.", false); return; }
      archive.versions.push({ label, entries: [] });
      await persist();
    }

    async function renameVersion(vi) {
      const v = archive.versions[vi];
      const label = promptText("Đổi tên phiên bản", v.label);
      if (!label || label === v.label) return;
      if (archive.versions.some((x, i) => i !== vi && x.label === label)) { toast("Tên phiên bản đã tồn tại.", false); return; }
      v.label = label;
      await persist();
    }

    async function deleteVersion(vi) {
      const v = archive.versions[vi];
      if (!window.confirm('Xóa phiên bản "' + v.label + '" và toàn bộ file trong đó?')) return;
      archive.versions.splice(vi, 1);
      await persist();
    }

    async function addFolder(parent) {
      const name = promptText("Tên thư mục mới");
      if (!name) return;
      const list = parent.children || parent.entries;
      if (list.some((e) => e.type === "folder" && e.name === name)) { toast("Thư mục đã tồn tại.", false); return; }
      list.push({ type: "folder", name, children: [] });
      await persist();
    }

    async function renameEntry(entries, i) {
      const e = entries[i];
      const name = promptText("Đổi tên", e.name);
      if (!name || name === e.name) return;
      e.name = name;
      await persist();
    }

    async function deleteEntry(entries, i) {
      const e = entries[i];
      if (!window.confirm('Xóa "' + e.name + '"?')) return;
      entries.splice(i, 1);
      await persist();
    }

    el("btn-add-version").addEventListener("click", addVersion);

    el("upload-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const file = el("up-file").files[0];
      if (!file) { toast("Chọn file cần tải lên.", false); return; }
      const version = el("up-version").value;
      const path = el("up-path").value.trim();
      const qs = new URLSearchParams({ version, path, name: file.name });
      const btn = e.target.querySelector("button[type=submit]");
      btn.disabled = true;
      btn.textContent = "Đang tải lên…";
      const { status, data } = await Auth.api("/api/upload?" + qs.toString(), { method: "POST", body: file });
      btn.disabled = false;
      btn.textContent = "Tải lên";
      if (status === 200) {
        archive = data.archive;
        refresh();
        el("up-file").value = "";
        toast("Đã tải lên thành công.");
      } else {
        toast((data && data.error) || "Lỗi tải lên.", false);
      }
    });

    el("pass-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const current = el("pass-current").value;
      const next = el("pass-new").value;
      if (next.length < 6) { toast("Mật khẩu mới phải có ít nhất 6 ký tự.", false); return; }
      const { status, data } = await Auth.api("/api/password", {
        method: "POST",
        body: JSON.stringify({ currentPassword: current, newPassword: next })
      });
      if (status === 200) {
        toast("Đã đổi mật khẩu.");
        el("pass-current").value = "";
        el("pass-new").value = "";
      } else {
        toast((data && data.error) || "Lỗi.", false);
      }
    });

    el("btn-logout").addEventListener("click", async () => {
      await Auth.logout();
      location.href = "index.html";
    });

    (async () => {
      const u = await Auth.me();
      if (!u || !u.isAdmin) {
        location.href = "login.html";
        return;
      }
      el("admin-who").textContent = u.name || u.username;
      try {
        await loadArchive();
      } catch (e) {
        toast("Không tải được dữ liệu: " + e.message, false);
        return;
      }
      refresh();
    })();
  </script>
</body>
</html>
